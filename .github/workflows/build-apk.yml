# Membangun APK Android di GitHub (tanpa Android Studio), menerbitkannya ke GitHub Releases,
# lalu memperbarui src/release.config.json -> push -> Vercel deploy ulang -> tombol Download APK di web aktif.
# Jalankan dari: GitHub > tab Actions > "Build APK" > Run workflow, atau dari CMS (menu Rilis aplikasi, khusus Super Admin).
name: Build APK

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Versi baru (x.y.z), mis. 1.0.1"
        required: true
        type: string
      notes:
        description: "Catatan rilis (opsional)"
        required: false
        type: string
        default: ""

permissions:
  contents: write

concurrency:
  group: build-apk
  cancel-in-progress: false

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      VERSION: ${{ inputs.version }}
      NOTES: ${{ inputs.notes }}
      VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
      VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
      VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
      VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
      VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
      VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
      VITE_SITE_URL: ${{ secrets.VITE_SITE_URL }}
    steps:
      - uses: actions/checkout@v4

      - name: Validasi versi
        run: |
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Format versi harus x.y.z"; exit 1; }
          test -d android || { echo "Folder android/ belum ada di repo. Jalankan 'npx cap add android' lalu commit folder android."; exit 1; }

      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Naikkan versi di konfigurasi rilis
        run: node scripts/release-set.cjs "$VERSION" --notes "$NOTES"

      - name: Pasang dependensi
        run: if [ -f package-lock.json ]; then npm ci; else npm install; fi

      - name: Build web dan sinkron ke Android
        run: npm run build && npx cap sync android

      - name: Siapkan penanda tangan (jika rahasia tersedia)
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            printf 'storeFile=%s\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' "$RUNNER_TEMP/release.jks" "$KS_PASS" "$KS_ALIAS" "$KEY_PASS" > android/keystore.properties
            echo "SIGNED=1" >> "$GITHUB_ENV"
          else
            echo "::warning::Keystore tidak diatur: APK dibuat versi debug (dapat dipasang, tetapi bukan untuk rilis resmi)."
          fi

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          if [ "$SIGNED" = "1" ]; then ./gradlew assembleRelease --no-daemon; else ./gradlew assembleDebug --no-daemon; fi

      - name: Siapkan berkas APK
        env:
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          FILE=$(node -p "require('./src/release.config.json').fileName")
          OUT=android/app/build/outputs/apk
          if [ "$SIGNED" = "1" ]; then
            if [ -f "$OUT/release/app-release.apk" ]; then
              cp "$OUT/release/app-release.apk" "$FILE"
            else
              BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
              "$BT/zipalign" -f -p 4 "$OUT/release/app-release-unsigned.apk" "$RUNNER_TEMP/aligned.apk"
              "$BT/apksigner" sign --ks "$RUNNER_TEMP/release.jks" --ks-pass env:KS_PASS --key-pass env:KEY_PASS --ks-key-alias "$KS_ALIAS" --out "$FILE" "$RUNNER_TEMP/aligned.apk"
            fi
          else
            cp "$OUT/debug/app-debug.apk" "$FILE"
          fi
          echo "APK_FILE=$FILE" >> "$GITHUB_ENV"

      - name: Catat ukuran APK di konfigurasi
        run: |
          SIZE=$(awk -v b="$(stat -c%s "$APK_FILE")" 'BEGIN{printf "%.1f", b/1048576}')
          CODE=$(node -p "require('./src/release.config.json').versionCode")
          node scripts/release-set.cjs "$VERSION" --code "$CODE" --size "$SIZE"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APK_FILE }}
          path: ${{ env.APK_FILE }}
          retention-days: 14

      - name: Terbitkan ke GitHub Releases (APK diunggah lebih dulu)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v$VERSION"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK_FILE" --clobber
          else
            gh release create "$TAG" "$APK_FILE" --title "Pagar Nusa CMS $TAG" --notes "${NOTES:-Rilis $TAG}" --target "${{ github.sha }}"
          fi

      - name: Commit konfigurasi rilis (memicu deploy ulang Vercel)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/release.config.json
          [ -f android/app/build.gradle ] && git add android/app/build.gradle || true
          git commit -m "chore(release): APK v$VERSION" || { echo "Tidak ada perubahan untuk di-commit"; exit 0; }
          git pull --rebase origin "${{ github.ref_name }}" || true
          git push origin "HEAD:${{ github.ref_name }}"
